<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#02030a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Nova Strike — Space Shooter</title>
<style>
  :root{
    --neon:#5ce1e6;
    --hot:#ff3b6b;
    --gold:#ffd166;
    --ui:1;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:none;
  }
  body{
    position:fixed;
    inset:0;
    background:#02030a;
    color:#e8f6ff;
    font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }
  #stage{position:absolute; inset:0; overflow:hidden; background:#02030a;}
  canvas{display:block; width:100%; height:100%; touch-action:none;}

  /* ---- on-screen buttons (mobile) ---- */
  #topbtns{
    position:absolute;
    top:calc(env(safe-area-inset-top, 0px) + 10px);
    right:calc(env(safe-area-inset-right, 0px) + 10px);
    display:none;
    gap:8px;
    z-index:6;
  }
  #topbtns.on{display:flex;}
  .iconbtn{
    width:44px; height:44px;
    border-radius:50%;
    border:1px solid rgba(92,225,230,.45);
    background:rgba(8,14,30,.62);
    color:#bff3f8;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    cursor:pointer;
    padding:0;
    transition:transform .1s ease, background .1s ease;
  }
  .iconbtn:active{transform:scale(.92); background:rgba(92,225,230,.22);}
  .iconbtn svg{width:22px; height:22px; fill:currentColor; display:block;}

  .overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 18px);
    background:radial-gradient(circle at 50% 42%, rgba(10,14,34,.80), rgba(2,3,10,.95));
    z-index:5;
  }
  .overlay.hidden{display:none;}
  .title{
    font-size:clamp(30px, 11vw, 74px);
    font-weight:800;
    letter-spacing:.12em;
    text-transform:uppercase;
    background:linear-gradient(90deg, var(--neon), #a78bfa 45%, var(--hot));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 18px rgba(92,225,230,.45));
    margin-bottom:4px;
  }
  .subtitle{
    font-size:clamp(10px, 3.1vw, 15px);
    letter-spacing:.30em;
    text-transform:uppercase;
    color:#8fa9c4;
    margin-bottom:22px;
  }
  .btn{
    cursor:pointer;
    border:1px solid rgba(92,225,230,.6);
    background:linear-gradient(180deg, rgba(92,225,230,.16), rgba(92,225,230,.04));
    color:#dffbff;
    padding:16px 44px;
    border-radius:999px;
    font-size:clamp(14px,3.6vw,17px);
    font-weight:700;
    letter-spacing:.14em;
    text-transform:uppercase;
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
    box-shadow:0 0 22px rgba(92,225,230,.22);
    min-height:52px;
    -webkit-appearance:none;
    appearance:none;
  }
  .btn:active{transform:scale(.96); background:linear-gradient(180deg, rgba(92,225,230,.30), rgba(92,225,230,.08));}
  .btn.ghost{border-color:rgba(255,255,255,.25); background:rgba(255,255,255,.05); color:#cfe6f5; box-shadow:none;}
  .howto{
    margin-top:24px;
    display:flex;
    flex-direction:column;
    gap:10px;
    font-size:clamp(11px,3.1vw,14px);
    color:#9fb6cc;
    max-width:340px;
  }
  .howto div{display:flex; align-items:center; gap:10px; justify-content:center;}
  .howto b{color:#e8f6ff; font-weight:700;}
  .pill{
    display:inline-block;
    border:1px solid rgba(92,225,230,.4);
    border-radius:999px;
    padding:3px 12px;
    font-size:.94em;
    color:#bff3f8;
    background:rgba(92,225,230,.10);
    white-space:nowrap;
  }
  .panel{
    background:rgba(8,12,26,.75);
    border:1px solid rgba(92,225,230,.28);
    border-radius:14px;
    padding:16px 22px;
    margin-top:8px;
    width:min(340px, 86vw);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }
  .panel .row{display:flex; justify-content:space-between; gap:20px; padding:6px 0; font-size:clamp(12px,3.3vw,16px);}
  .panel .row span:first-child{color:#93aac2;}
  .panel .row span:last-child{color:#fff; font-weight:700;}
  .big{font-size:clamp(28px,8vw,52px); font-weight:800; letter-spacing:.06em; margin:4px 0 14px;}
  .accent{color:var(--neon);}
  .hot{color:var(--hot);}
  .gold{color:var(--gold);}
  .legend{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:20px; max-width:360px;}
  .legend div{display:flex; flex-direction:column; align-items:center; gap:4px; font-size:clamp(9px,2.5vw,11px); color:#a9bed2;}
  .legend img{width:30px; height:30px;}
  #touchhint{
    position:absolute;
    left:0; right:0;
    bottom:34%;
    text-align:center;
    font-size:13px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:#7fd8e2;
    z-index:4;
    pointer-events:none;
    opacity:0;
    transition:opacity .5s ease;
  }
  #touchhint.on{opacity:.9;}
  .flash{animation:flashy .45s ease;}
  @keyframes flashy{0%{opacity:0; transform:scale(.95)}100%{opacity:1; transform:scale(1)}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <div id="topbtns">
    <button class="iconbtn" id="btnMute" aria-label="Sound">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="muteArc" d="M16.5 8.5a4.2 4.2 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path id="muteX" d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"/></svg>
    </button>
    <button class="iconbtn" id="btnPause" aria-label="Pause">
      <svg viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>
    </button>
  </div>

  <div class="overlay" id="menu">
    <div class="title">Nova Strike</div>
    <div class="subtitle">Deep Space Defense</div>
    <button class="btn" id="btnStart">Tap to Launch</button>
    <div class="howto">
      <div><b>Move</b><span class="pill">drag anywhere</span></div>
      <div><b>Fire</b><span class="pill">automatic</span></div>
      <div><b>Pause</b><span class="pill">button, top right</span></div>
    </div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="overlay hidden" id="pause">
    <div class="title" style="font-size:clamp(26px,8vw,50px)">Paused</div>
    <button class="btn" id="btnResume">Resume</button>
    <button class="btn ghost" id="btnQuit" style="margin-top:12px">Abort Mission</button>
  </div>

  <div class="overlay hidden" id="levelup">
    <div class="subtitle" style="margin-bottom:2px">Sector Cleared</div>
    <div class="big accent" id="levelBig">LEVEL 2</div>
    <div class="panel">
      <div class="row"><span>Score</span><span id="luScore">0</span></div>
      <div class="row"><span>Lives</span><span id="luLives">3</span></div>
      <div class="row"><span>Bonus</span><span class="gold" id="luBonus">+0</span></div>
    </div>
    <button class="btn" id="btnNext" style="margin-top:18px">Continue</button>
  </div>

  <div class="overlay hidden" id="gameover">
    <div class="title hot" style="font-size:clamp(28px,9vw,62px)">Ship Destroyed</div>
    <div class="subtitle" id="goSub">Mission Failed</div>
    <div class="panel">
      <div class="row"><span>Final Score</span><span class="accent" id="goScore">0</span></div>
      <div class="row"><span>Level Reached</span><span id="goLevel">1</span></div>
      <div class="row"><span>Enemies Destroyed</span><span id="goKills">0</span></div>
      <div class="row"><span>Best Score</span><span class="gold" id="goBest">0</span></div>
    </div>
    <button class="btn" id="btnRetry" style="margin-top:18px">Fly Again</button>
  </div>

  <div id="touchhint">Drag anywhere to fly</div>
</div>

/* ---------------- Sprites ---------------- */
const SPR = {}, SPRW = {};

function buildWhite(img){
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const x = c.getContext('2d');
  x.drawImage(img, 0, 0);
  x.globalCompositeOperation = 'source-in';
  x.fillStyle = '#ffffff';
  x.fillRect(0, 0, c.width, c.height);
  return c;
}

function loadSprites(cb){
  const keys = Object.keys(SPRITE_DATA);
  let n = 0;
  keys.forEach(k => {
    const im = new Image();
    const done = () => { if (++n === keys.length) cb(); };
    im.onload = () => {
      SPR[k] = im;
      if (/^(grunt|zig|gunner|tank|boss)$/.test(k)) SPRW[k] = buildWhite(im);
      done();
    };
    im.onerror = done;
    im.src = SPRITE_DATA[k];
  });
}

function drawSprite(name, cx, cy, size, rot, alpha, white){
  const im = white ? SPRW[name] : SPR[name];
  if (!im || !im.complete || !im.naturalWidth) return;
  ctx.save();
  if (alpha != null) ctx.globalAlpha = alpha;
  if (rot){
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.drawImage(im, -size/2, -size/2, size, size);
  } else {
    ctx.drawImage(im, cx - size/2, cy - size/2, size, size);
  }
  ctx.restore();
}

/* ---------------- Background textures ---------------- */
const TEX = { nebula:[], planet:[] };

function makeNebulaTex(size, hue, seed){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  let s = seed;
  const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  x.filter = 'blur(' + (size * 0.06) + 'px)';
  for (let i = 0; i < 26; i++){
    const cx = rnd()*size, cy = rnd()*size, r = size*(0.10 + rnd()*0.26);
    const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
    const a = 0.10 + rnd()*0.20;
    g.addColorStop(0, 'hsla(' + (hue + rnd()*40 - 20) + ',85%,68%,' + a + ')');
    g.addColorStop(1, 'hsla(' + hue + ',85%,55%,0)');
    x.fillStyle = g;
    x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill();
  }
  x.filter = 'none';
  x.globalCompositeOperation = 'destination-in';
  const mask = x.createRadialGradient(size/2, size/2, size*0.04, size/2, size/2, size*0.5);
  mask.addColorStop(0,    'rgba(255,255,255,1)');
  mask.addColorStop(0.55, 'rgba(255,255,255,0.82)');
  mask.addColorStop(0.82, 'rgba(255,255,255,0.32)');
  mask.addColorStop(1,    'rgba(255,255,255,0)');
  x.fillStyle = mask;
  x.fillRect(0, 0, size, size);
  x.globalCompositeOperation = 'source-over';
  return c;
}

function makePlanetTex(size, hue, ringed){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  const cx = size/2, cy = size/2, r = size*0.30;
  if (ringed){
    x.save(); x.translate(cx,cy); x.rotate(-0.42); x.scale(1,0.26);
    x.strokeStyle = 'hsla('+hue+',55%,72%,0.55)'; x.lineWidth = size*0.045;
    x.beginPath(); x.arc(0,0,r*1.72,0,7); x.stroke();
    x.strokeStyle = 'hsla('+hue+',55%,80%,0.28)'; x.lineWidth = size*0.020;
    x.beginPath(); x.arc(0,0,r*1.98,0,7); x.stroke();
    x.restore();
  }
  const g = x.createRadialGradient(cx-r*0.35, cy-r*0.40, r*0.10, cx, cy, r*1.06);
  g.addColorStop(0,'hsl('+hue+',72%,74%)');
  g.addColorStop(0.55,'hsl('+hue+',62%,46%)');
  g.addColorStop(1,'hsl('+hue+',70%,15%)');
  x.shadowColor = 'hsla('+hue+',80%,60%,0.55)'; x.shadowBlur = size*0.06;
  x.fillStyle = g;
  x.beginPath(); x.arc(cx,cy,r,0,7); x.fill();
  x.shadowBlur = 0;
  x.save();
  x.beginPath(); x.arc(cx,cy,r,0,7); x.clip();
  x.globalAlpha = 0.16;
  for (let i = 0; i < 7; i++){
    x.fillStyle = i%2 ? 'hsl('+hue+',40%,85%)' : 'hsl('+hue+',55%,20%)';
    x.fillRect(cx-r, cy-r + (i/7)*r*2, r*2, r*0.11);
  }
  x.restore();
  const sh = x.createRadialGradient(cx+r*0.55, cy+r*0.45, r*0.1, cx+r*0.2, cy+r*0.2, r*1.5);
  sh.addColorStop(0,'rgba(0,0,0,0)');
  sh.addColorStop(1,'rgba(0,0,0,0.72)');
  x.fillStyle = sh; x.beginPath(); x.arc(cx,cy,r,0,7); x.fill();
  return c;
}

function buildTextures(){
  TEX.nebula = [ makeNebulaTex(512, 190, 7), makeNebulaTex(512, 315, 23), makeNebulaTex(512, 255, 41) ];
  TEX.planet = [ makePlanetTex(320, 205, false), makePlanetTex(320, 35, true), makePlanetTex(320, 285, false) ];
}

let bgGrad = null, vigGrad = null, warnGrad = null, deepLayer = null;
let qLevel = 0, perfAcc = 0, perfN = 0, perfT = 0;

function perfTick(dt){
  if (qLevel >= 2) return;
  perfAcc += dt; perfN++; perfT += dt;
  if (perfT > 1.5){
    const fps = perfN / perfAcc;
    // phones: degrade earlier so play stays smooth
    if (fps < (COARSE ? 38 : 28)) qLevel = 2;
    else if (fps < (COARSE ? 52 : 45)) qLevel = 1;
    perfAcc = 0; perfN = 0; perfT = 0;
  }
}

/* ---------------- Input (touch-first) ---------------- */

  if (e.code === 'KeyM') toggleMute();
});

const touch = { active:false, id:null, x:0, y:0, moved:false };
let hintShown = false;

function relScale(){
  const r = canvas.getBoundingClientRect();
  return { sx: W / r.width, sy: H / r.height };
}
canvas.addEventListener('pointerdown', ev => {
  audio();
  if (ev.pointerType === 'mouse' && ev.button !== 0) return;
  touch.active = true; touch.id = ev.pointerId; touch.moved = false;
  touch.x = ev.clientX; touch.y = ev.clientY;
  try { canvas.setPointerCapture(ev.pointerId); } catch(e){}
  if (state === STATE.PLAY && !hintShown){ hintShown = true; el.touchhint.classList.remove('on'); }

}, { passive:false });

canvas.addEventListener('pointermove', ev => {
  if (!touch.active || ev.pointerId !== touch.id) return;
  const s = relScale();
  const dx = (ev.clientX - touch.x) * s.sx;
  const dy = (ev.clientY - touch.y) * s.sy;
  touch.x = ev.clientX; touch.y = ev.clientY;
  if (Math.abs(dx) + Math.abs(dy) > 0.5) touch.moved = true;
  if (state === STATE.PLAY && player){
    player.x = clamp(player.x + dx, 6, W - player.w - 6);
    player.y = clamp(player.y + dy, 6, H - player.h - 6);
  }
  ev.preventDefault();
}, { passive:false });

function endTouch(ev){
  if (ev && ev.pointerId !== touch.id) return;
  touch.active = false; touch.id = null;
}
canvas.addEventListener('pointerup', endTouch);

/* ---------------- Audio ---------------- */
let actx = null, muted = false;
function audio(){
  if (!actx){ const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function beep(o){
  if (muted) return;
  const a = audio(); if (!a) return;
  const osc = a.createOscillator(), g = a.createGain();
  osc.type = o.type || 'square';
  const t = a.currentTime;
  osc.frequency.setValueAtTime(o.f0, t);
  osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t + o.dur);
  g.gain.setValueAtTime(o.vol, t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + o.dur);
  osc.connect(g); g.connect(a.destination);
  osc.start(t); osc.stop(t + o.dur + 0.02);
}
function sfx(n){
  switch(n){
    case 'shoot':   beep({type:'square', f0:900, f1:260, dur:0.07, vol:0.028}); break;
    case 'enemy':   beep({type:'sawtooth', f0:420, f1:180, dur:0.09, vol:0.020}); break;
    case 'boom':    beep({type:'triangle', f0:320, f1:60, dur:0.22, vol:0.040}); break;

    case 'escape':  beep({type:'sawtooth', f0:540, f1:150, dur:0.16, vol:0.038}); break;
  }
}

/* ---------------- Utility ---------------- */
const rand = (a,b) => a + Math.random()*(b-a);
const randInt = (a,b) => Math.floor(rand(a,b+1));
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
function aabb(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

/* ---------------- State ---------------- */
const STATE = { MENU:'menu', PLAY:'play', PAUSE:'pause', LEVELUP:'levelup', GAMEOVER:'gameover' };
let state = STATE.MENU;

let player, bullets, enemyBullets, enemies, powerups, particles, bg;
let spawnQueue, level, wave, wavesPerLevel, score, lives, kills, shake, flashT, elapsed;
let waveBanner, waveBannerT, best = 0, hudPulse = 0;
let warnT = 0, escapeT = 0, escapedCount = 0, lastEscapeSfx = -9;
let lastT = performance.now();

try { best = parseInt(localStorage.getItem('nova_best') || '0', 10) || 0; } catch(e){ best = 0; }

/* ---------------- Background layers ---------------- */
function layoutBackground(){
  bg = { stars: [], planets: [], rocks: [], streaks: [], streakT: rand(2,5), t: 0 };
  const area = W * H;
  const layers = [
    { n: Math.round(area/26000), r: 0.9, v: 14, a: 0.40 },
    { n: Math.round(area/42000), r: 1.4, v: 34, a: 0.65 },
    { n: Math.round(area/80000), r: 2.2, v: 68, a: 0.95 }
  ];
  for (const L of layers){
    for (let i = 0; i < L.n; i++)
      bg.stars.push({ x: rand(0,W), y: rand(0,H), r: L.r, v: L.v, a: L.a, tw: rand(0,6.28) });
  }
  for (let i = 0; i < 2; i++){
    bg.planets.push({ tex: TEX.planet[i % TEX.planet.length], x: rand(0,W), y: rand(-H*0.1, H*0.5),
      size: rand(150, 280), v: rand(2.5, 6), a: rand(0.7, 0.95) });
  }
  const nRocks = COARSE ? Math.round(W/260) : Math.round(W/150);
  for (let i = 0; i < nRocks; i++){
    bg.rocks.push({ x: rand(0,W), y: rand(0,H), size: rand(20,54), vx: rand(-26,-10), vy: rand(10,26),
      rot: rand(0,6.28), vr: rand(-0.5,0.5), a: rand(0.35, 0.8) });
  }
}

function updateBackground(dt){
  if (!bg) return;
  bg.t += dt;
  const push = state === STATE.PLAY ? 1 : 0.35;
  for (const s of bg.stars){
    s.y += s.v * dt * push; s.tw += dt * 2.2;
    if (s.y > H + 4){ s.y = -4; s.x = rand(0, W); }
  }
  for (const pl of bg.planets){
    pl.y += pl.v * dt * push * 0.5;
    if (pl.y - pl.size/2 > H){ pl.y = -pl.size; pl.x = rand(0, W); }
  }
  for (const rk of bg.rocks){
    rk.x += rk.vx * dt * push; rk.y += rk.vy * dt * push; rk.rot += rk.vr * dt;
    if (rk.y > H + 60 || rk.x < -60){
      rk.x = rand(W*0.4, W + 60); rk.y = rand(-80, -20);
      rk.size = rand(20,54); rk.vx = rand(-26,-10); rk.vy = rand(10,26);
    }
  }
  bg.streakT -= dt;
  if (bg.streakT <= 0){
    bg.streakT = rand(4, 11);
    bg.streaks.push({ x: rand(W*0.1, W), y: rand(-40, H*0.4), vx: rand(-620,-380), vy: rand(240,420), life: 1.0, len: rand(120,260) });
  }
  for (let i = bg.streaks.length - 1; i >= 0; i--){
    const st = bg.streaks[i];
    st.x += st.vx*dt; st.y += st.vy*dt; st.life -= dt*0.9;
    if (st.life <= 0 || st.y > H+120 || st.x < -200) bg.streaks.splice(i,1);
  }
}

function buildDeepLayer(){
  const cw = canvas.width, ch = canvas.height;
  if (!cw || !ch || !TEX.nebula.length) return;
  const c = document.createElement('canvas');
  c.width = cw; c.height = ch;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, ch);
  g.addColorStop(0, '#050713');
  g.addColorStop(0.55, '#03040d');
  g.addColorStop(1, '#070512');
  x.fillStyle = g; x.fillRect(0, 0, cw, ch);
  for (let i = 0; i < 5; i++){
    const tex = TEX.nebula[i % TEX.nebula.length];
    const size = rand(cw*0.65, cw*1.15);
    x.save();
    x.globalAlpha = rand(0.34, 0.62);
    x.translate(rand(-cw*0.15, cw*0.85), rand(-ch*0.25, ch*0.75));
    x.rotate(rand(-0.25, 0.25));
    x.drawImage(tex, -size/2, -size/2, size, size);
    x.restore();
  }
  deepLayer = c;
}

function drawBackground(){
  if (!bg) return;
  ctx.fillStyle = bgGrad || '#03040d';
  ctx.fillRect(0, 0, W, H);
  if (deepLayer) ctx.drawImage(deepLayer, 0, 0, W, H);

  if (qLevel < 1) for (const pl of bg.planets){
    if (pl.y - pl.size > H || pl.y + pl.size < 0) continue;
    ctx.save();
    ctx.globalAlpha = pl.a;
    ctx.drawImage(pl.tex, pl.x - pl.size/2, pl.y - pl.size/2, pl.size, pl.size);
    ctx.restore();
  }
  for (const s of bg.stars){
    ctx.globalAlpha = s.a * (0.72 + Math.sin(s.tw) * 0.28);
    ctx.fillStyle = '#d6ecff';
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }
  ctx.globalAlpha = 1;

  if (qLevel < 2) for (const st of bg.streaks){
    const a = clamp(st.life, 0, 1);
    const ex = st.x - st.vx * (st.len/700), ey = st.y - st.vy * (st.len/700);
    const lg = ctx.createLinearGradient(st.x, st.y, ex, ey);
    lg.addColorStop(0, 'rgba(220,245,255,' + a + ')');
    lg.addColorStop(1, 'rgba(220,245,255,0)');
    ctx.strokeStyle = lg; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(st.x, st.y); ctx.lineTo(ex, ey); ctx.stroke();
  }

  if (qLevel < 2) for (const rk of bg.rocks){
    if (rk.y - rk.size > H || rk.y + rk.size < 0) continue;
    ctx.save();
    ctx.globalAlpha = rk.a * 0.75;
    ctx.translate(rk.x, rk.y); ctx.rotate(rk.rot);
    const im = SPR.asteroid;
    if (im && im.complete) ctx.drawImage(im, -rk.size/2, -rk.size/2, rk.size, rk.size);
    ctx.restore();
  }
}

/* ---------------- Player ---------------- */
function resetPlayer(){
  player = {
    x: W/2 - 23, y: H - 150, w: 46, h: 50,
    speed: 470, cooldown: 0, baseRate: 0.185,
    weapon: 1, rapid: 0, shield: 0,
    invuln: 1.6, alive: true, thrust: 0, trailT: 0
  };
}

function newGame(){
  bullets = []; enemyBullets = []; enemies = []; powerups = []; particles = [];
  spawnQueue = [];
  level = 1; wave = 0; wavesPerLevel = 4;
  score = 0; lives = 3; kills = 0; shake = 0; flashT = 0; elapsed = 0; hudPulse = 0;
  waveBanner = ''; waveBannerT = 0;
  warnT = 0; escapeT = 0; escapedCount = 0; lastEscapeSfx = -9;
  hintShown = false;
  layoutBackground();
  buildDeepLayer();
  resetPlayer();
  startWave();
}

/* ---------------- Enemies ---------------- */
function enemyStats(type){
  const lvl = level;
  const hpUp = 1 + (lvl - 1) * 0.38;
  const spUp = 1 + (lvl - 1) * 0.11;
  switch(type){
    case 'grunt':  return { w:36, h:36, hp: Math.round(2*hpUp),  vy: 92*spUp, vx: 0,  color:'#ff5d73', score:100,  shoot:0 };
    case 'zig':    return { w:34, h:34, hp: Math.round(2*hpUp),  vy: 70*spUp, vx: 88, color:'#ffd166', score:150,  shoot:0 };
    case 'gunner': return { w:42, h:42, hp: Math.round(4*hpUp),  vy: 64*spUp, vx: 0,  color:'#8b5cff', score:250,  shoot:1.7 };
    case 'tank':   return { w:58, h:58, hp: Math.round(11*hpUp), vy: 44*spUp, vx: 0,  color:'#5ce1e6', score:420,  shoot:2.3 };
    case 'boss':   return { w:132,h:112,hp: Math.round(120*hpUp),vy: 44,       vx: 70, color:'#ff3b6b', score:5000, shoot:1.15 };
    default:       return { w:36, h:36, hp:2, vy:80, vx:0, color:'#fff', score:50, shoot:0 };
  }
}

function spawnEnemy(type, x, opts){
  opts = opts || {};
  const s = enemyStats(type);
  const e = {
    type, x: x, y: opts.y != null ? opts.y : -s.h - 10,
    w: s.w, h: s.h, hp: s.hp, maxHp: s.hp,
    vx: opts.vx != null ? opts.vx : s.vx,
    vy: s.vy * VS,                       // tall screens descend proportionally faster
    color: s.color, score: s.score,
    shootRate: s.shoot, shootT: s.shoot ? rand(0.5, s.shoot) : 0,
    t: rand(0, 6.28), baseX: x, hitFlash: 0,
    dir: Math.random() < 0.5 ? -1 : 1,
    targetY: opts.targetY != null ? opts.targetY : rand(90, 250) * VS
  };
  enemies.push(e);
  return e;
}

function pickType(){
  const r = Math.random();
  if (level <= 1) return r < 0.75 ? 'grunt' : 'zig';
  if (level === 2){ if (r < 0.5) return 'grunt'; if (r < 0.8) return 'zig'; return 'gunner'; }
  if (r < 0.34) return 'grunt';
  if (r < 0.58) return 'zig';
  if (r < 0.82) return 'gunner';
  return 'tank';
}

function startWave(){
  wave++;
  spawnQueue = [];
  const isBossWave = (wave === wavesPerLevel) && (level % 3 === 0);

  if (isBossWave){
    waveBanner = 'WARNING \u2014 BOSS INCOMING';
    spawnQueue.push({ t: 1.4, fn: () => spawnEnemy('boss', W/2 - 66, { y: -130 }) });
    for (let i = 0; i < 4; i++){
      const xx = W*0.5 + (i - 1.5) * Math.min(190, W*0.24);
      spawnQueue.push({ t: 2.6 + i*0.4, fn: () => spawnEnemy('gunner', clamp(xx, 40, W-100), { y: -60 }) });
    }
  } else {
    waveBanner = 'LEVEL ' + level + '  \u00b7  WAVE ' + wave + '/' + wavesPerLevel;
    const density = clamp(VS, 1, 1.7);   // tall screens get more ships
    const count = Math.min(Math.round((5 + level + wave*2) * density), 26);
    const form = randInt(0, 3);
    const laneW = W / 6;
    for (let i = 0; i < count; i++){
      let x, delay = 0.28 + i*0.22;
      if (form === 0) x = W/2 - (60 + i*Math.min(44, W*0.06));
      else if (form === 1) x = (i % 2 === 0) ? rand(W*0.06, W*0.28) : rand(W*0.72, W*0.94);
      else if (form === 2){ x = laneW*0.6 + (i % 6) * laneW; delay = 0.35 + Math.floor(i/6)*0.9 + (i%6)*0.12; }
      else x = rand(W*0.05, W*0.9);
      const type = pickType(), tgt = rand(90, 300);
      const xx = clamp(x, 20, W - 90), tt = type;
      spawnQueue.push({ t: delay, fn: () => spawnEnemy(tt, xx, { targetY: tgt }) });
    }
  }
  waveBannerT = 2.4;
  sfx('level');
}

/* ---------------- Shooting ---------------- */
function firePlayer(){
  const rate = player.rapid > 0 ? player.baseRate * 0.55 : player.baseRate;
  if (player.cooldown > 0) return;
  player.cooldown = rate;
  sfx('shoot');
  const cx = player.x + player.w/2, cy = player.y;
  const mk = (ox, vx, vy, dmg, hue) => bullets.push({
    x: cx+ox-3, y: cy-10, w: 6, h: 18, vx: vx, vy: vy*VS, dmg, hue: hue || '#8ffcff', t: 0
  });
  if (player.weapon === 1) mk(0, 0, -780, 1);
  else if (player.weapon === 2){ mk(-10, 0, -780, 1); mk(10, 0, -780, 1); }
  else { mk(0, 0, -820, 2, '#d9fbff'); mk(-15, -190, -720, 1); mk(15, 190, -720, 1); }
  addParticle(cx, cy - 8, 0, 90, '#bff6ff', 0.16, 26, 'glow', 0.7);
}

function enemyShoot(e, angle, speed, color){
  const cx = e.x + e.w/2, cy = e.y + e.h;
  enemyBullets.push({
    x: cx-5, y: cy-5, w: 10, h: 10,
    vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed*VS,
    color: color || '#ff9ec4', t: 0
  });
  sfx('enemy');
}

/* ---------------- Particles ---------------- */
function addParticle(x, y, vx, vy, color, life, size, kind, alpha){
  if (particles.length > PARTICLE_CAP) return;
  particles.push({ x, y, vx, vy, color, life, maxLife: life, size: size || 3,
    kind: kind || 'dot', alpha: alpha == null ? 1 : alpha, rot: rand(0,6.28), vr: rand(-4,4) });
}
function burst(x, y, color, n, power, kind){
  for (let i = 0; i < n; i++){
    const a = rand(0, Math.PI*2), sp = rand(40, power);
    addParticle(x, y, Math.cos(a)*sp, Math.sin(a)*sp, color, rand(0.3, 0.8),
      kind === 'glow' ? rand(18, 44) : rand(2, 5), kind || 'dot');
  }
}
function explosion(x, y, color, scaleF){
  const s = scaleF || 1;
  addParticle(x, y, 0, 0, '#ffffff', 0.30, 40*s, 'ring', 0.9);
  addParticle(x, y, 0, 0, color, 0.45, 70*s, 'glow', 0.85);
  burst(x, y, color, COARSE ? 9 : 14, 240*s, 'glow');
  burst(x, y, '#fff3c4', COARSE ? 6 : 10, 300*s, 'dot');
}

/* ---------------- Power-ups ---------------- */
const POWER_DEFS = {
  rapid:  { sprite:'pu_rapid',  color:'#ffd166' },
  spread: { sprite:'pu_spread', color:'#8b5cff' },
  shield: { sprite:'pu_shield', color:'#5ce1e6' },
  life:   { sprite:'pu_life',   color:'#ff5d73' },
  bomb:   { sprite:'pu_bomb',   color:'#fff0a8' }
};
function maybeDrop(x, y, forceType){
  if (!forceType && Math.random() > 0.16) return;
  const pool = ['rapid','spread','shield','rapid','spread','bomb'];
  const type = forceType || pool[randInt(0, pool.length-1)];
  powerups.push({ x: x-15, y: y-15, w:30, h:30, vy: 100*VS, type, t: rand(0,6.28) });
}
function applyPower(type){
  sfx('power'); hudPulse = 0.5;
  if (type === 'rapid') player.rapid = Math.min(14, player.rapid + 8);
  else if (type === 'spread') player.weapon = Math.min(3, player.weapon + 1);
  else if (type === 'shield') player.shield = Math.min(14, player.shield + 9);
  else if (type === 'life') lives = Math.min(6, lives + 1);
  else if (type === 'bomb') novaBomb();
  score += 50;
}
function novaBomb(){
  sfx('bigboom');
  shake = Math.max(shake, 18);
  flashT = 0.35;
  addParticle(W/2, H/2, 0, 0, '#fff0a8', 0.7, Math.max(W,H)*1.2, 'ring', 0.9);
  for (const e of enemies){ if (e.type === 'boss'){ e.hp -= 22; e.hitFlash = 0.2; } else e.hp -= 999; }
  for (let i = 0; i < (COARSE ? 42 : 70); i++){
    const a = rand(0, Math.PI*2), sp = rand(140, 700);
    addParticle(W/2, H/2, Math.cos(a)*sp, Math.sin(a)*sp, i%2 ? '#fff0a8' : '#ffd166', rand(0.4,0.95), rand(3,7), 'glow');
  }
}

/* ---------------- Damage ---------------- */
function damageEnemy(e, dmg){
  e.hp -= dmg;
  e.hitFlash = 0.12;
  if (e.hp <= 0){
    e.dead = true; kills++; score += e.score;
    if (e.type === 'boss'){
      sfx('bigboom');
      explosion(e.x + e.w/2, e.y + e.h/2, '#ff3b6b', 2.6);
      explosion(e.x + e.w/2 - 40, e.y + e.h/2 + 20, '#ffd166', 1.6);
      explosion(e.x + e.w/2 + 40, e.y + e.h/2 - 10, '#ff9ec4', 1.6);
      shake = Math.max(shake, 24);
      maybeDrop(e.x + e.w/2 - 24, e.y + e.h/2, 'life');
      maybeDrop(e.x + e.w/2, e.y + e.h/2, 'spread');
      maybeDrop(e.x + e.w/2 + 24, e.y + e.h/2, 'shield');
    } else {
      sfx('boom');
      explosion(e.x + e.w/2, e.y + e.h/2, e.color, 1);
      maybeDrop(e.x + e.w/2, e.y + e.h/2);
      shake = Math.max(shake, 3);
    }
  }
}

function hurtPlayer(){
  if (player.invuln > 0) return;
  if (player.shield > 0){
    player.shield = 0; player.invuln = 1.0;
    sfx('hurt');
    explosion(player.x + player.w/2, player.y + player.h/2, '#5ce1e6', 1.3);
    shake = Math.max(shake, 9);
    return;
  }
  lives--;
  sfx('hurt');
  explosion(player.x + player.w/2, player.y + player.h/2, '#8ffcff', 1.6);
  shake = Math.max(shake, 16);
  flashT = 0.28;
  if (lives < 0) gameOver();
  else {
    player.weapon = Math.max(1, player.weapon - 1);
    player.rapid = 0;
    player.x = W/2 - player.w/2;
    player.y = H - 150;
    player.invuln = 2.0;
  }
}

function gameOver(){
  state = STATE.GAMEOVER;
  player.alive = false;
  const isBest = score > best;
  if (isBest){ best = score; try { localStorage.setItem('nova_best', String(best)); } catch(e){} }
  el.goScore.textContent = score.toLocaleString();
  el.goLevel.textContent = level;
  el.goKills.textContent = kills;
  el.goBest.textContent = best.toLocaleString();
  el.goSub.textContent = isBest && score > 0 ? 'New Personal Best!' : 'Mission Failed';
  show(el.gameover);
}

/* ---------------- Overlays ---------------- */
function show(o){ o.classList.remove('hidden'); o.classList.remove('flash'); void o.offsetWidth; o.classList.add('flash'); }
function hide(o){ o.classList.add('hidden'); }
function hideAll(){ [el.menu, el.pause, el.levelup, el.gameover].forEach(hide); }

function togglePause(){
  if (state === STATE.PLAY){ state = STATE.PAUSE; show(el.pause); }
  else if (state === STATE.PAUSE){ state = STATE.PLAY; hide(el.pause); lastT = performance.now(); }
}

/* ---------------- Update ---------------- */
function update(dt){
  updateBackground(dt);
  if (hudPulse > 0) hudPulse -= dt;
  if (state !== STATE.PLAY) return;

  elapsed += dt;
  shake = Math.max(0, shake - dt*44);
  flashT = Math.max(0, flashT - dt);
  if (waveBannerT > 0) waveBannerT -= dt;
  if (warnT > 0) warnT -= dt;
  if (escapeT > 0) escapeT -= dt;

  const p = player;
  if (p.invuln > 0) p.invuln -= dt;
  if (p.rapid > 0) p.rapid -= dt;
  if (p.shield > 0) p.shield -= dt;
  if (p.cooldown > 0) p.cooldown -= dt;

  // keyboard (desktop / connected keyboard)
  let ax = 0, ay = 0;
  if (keys['ArrowLeft'])  ax -= 1;
  if (keys['ArrowRight']) ax += 1;
  if (keys['ArrowUp'])    ay -= 1;
  if (keys['ArrowDown'])  ay += 1;
  if (ax || ay){
    const len = Math.hypot(ax, ay) || 1;
    p.x += (ax/len) * p.speed * dt;
    p.y += (ay/len) * p.speed * VS * dt;
    p.thrust = 1;
  } else p.thrust *= 0.86;

  p.x = clamp(p.x, 6, W - p.w - 6);
  p.y = clamp(p.y, 6, H - p.h - 6);

  // engine trail
  p.trailT -= dt;
  if ((p.thrust > 0.15 || touch.active) && p.trailT <= 0){
    p.trailT = 0.03;
    const cx = p.x + p.w/2;
    addParticle(cx + rand(-7,7), p.y + p.h - 2, rand(-24,24), rand(120, 220)*VS, '#7fe4ff', rand(0.22,0.42), rand(14,26), 'glow', 0.6);
  }

  // auto-fire: always on while playing
  firePlayer();

  for (let i = spawnQueue.length - 1; i >= 0; i--){
    const s = spawnQueue[i];
    s.t -= dt;
    if (s.t <= 0){ s.fn(); spawnQueue.splice(i, 1); }
  }

  for (let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.t += dt; b.x += b.vx*dt; b.y += b.vy*dt;
    if (b.y + b.h < -30 || b.x < -40 || b.x > W + 40) bullets.splice(i, 1);
  }

  for (let i = enemies.length - 1; i >= 0; i--){
    const e = enemies[i];
    e.t += dt;
    if (e.hitFlash > 0) e.hitFlash -= dt;

    if (e.type === 'zig'){ e.x = e.baseX + Math.sin(e.t*2.2)*70; e.y += e.vy*dt; }
    else if (e.type === 'grunt'){ e.y += e.vy*dt; e.x += Math.sin(e.t*1.5)*26*dt; }
    else if (e.type === 'gunner'){ if (e.y < e.targetY) e.y += e.vy*dt; else e.x = e.baseX + Math.sin(e.t*1.2)*90; }
    else if (e.type === 'tank'){
      if (e.y < e.targetY) e.y += e.vy*dt;
      else { e.x += e.vx*e.dir*dt*1.6; if (e.x < 20 || e.x + e.w > W - 20) e.dir *= -1; }
    } else if (e.type === 'boss'){
      const hover = 150 * VS;
      if (e.y < hover) e.y += e.vy*dt;
      else { e.x += e.vx*e.dir*dt; if (e.x < 30 || e.x + e.w > W - 30) e.dir *= -1; e.y = hover + Math.sin(e.t*1.1)*22; }
    }
    e.x = clamp(e.x, -10, W - e.w + 10);

    if (e.shootRate > 0 && e.y > 20 && !e.dead){
      e.shootT -= dt;
      if (e.shootT <= 0){
        e.shootT = e.shootRate * rand(0.8, 1.2);
        const cx = e.x + e.w/2, cy = e.y + e.h/2;
        if (e.type === 'gunner'){
          enemyShoot(e, Math.atan2(player.y - cy, player.x + player.w/2 - cx), 250, '#c9b6ff');
        } else if (e.type === 'tank'){
          for (let k = -1; k <= 1; k++) enemyShoot(e, Math.PI/2 + k*0.42, 210, '#9ff2f7');
        } else if (e.type === 'boss'){
          const phase = e.hp < e.maxHp*0.5 ? 2 : 1;
          for (let k = 0; k < 3 + phase*3; k++) enemyShoot(e, Math.PI/2 + (k - (1 + phase*1.5))*0.22, 230, '#ff8fb0');
          enemyShoot(e, Math.atan2(player.y - cy, player.x + player.w/2 - cx), 300, '#ffd166');
        }
      }
    }

    if (e.y > H + 90){
      // Slipped past the bottom: loop it back around to re-enter from the top.
      // It is never removed, so a wave only ends once every ship is destroyed.
      if (enemies.length < 46){
        e.y = -e.h - 14;
        e.x = clamp(rand(W*0.08, W*0.90), 20, W - e.w - 20);
        e.baseX = e.x;
        e.t = rand(0, 6.28);
        e.dir = Math.random() < 0.5 ? -1 : 1;
        e.hitFlash = 0;
        escapedCount++;
        warnT = 0.5; escapeT = 0.9;
        if (elapsed - lastEscapeSfx > 0.22){ sfx('escape'); lastEscapeSfx = elapsed; }
        burst(clamp(e.x + e.w/2, 12, W-12), H - 8, '#ff3b6b', 9, 200, 'glow');
        burst(e.x + e.w/2, 10, '#ff3b6b', 7, 160, 'glow');
        continue;
      }
      enemies.splice(i, 1); continue;
    }
    if (e.dead){ enemies.splice(i, 1); continue; }
    if (aabb(e, p) && p.invuln <= 0){ damageEnemy(e, 999); hurtPlayer(); continue; }
  }

  for (let bi = bullets.length - 1; bi >= 0; bi--){
    const b = bullets[bi];
    for (let ei = 0; ei < enemies.length; ei++){
      if (aabb(b, enemies[ei])){
        damageEnemy(enemies[ei], b.dmg);
        burst(b.x + b.w/2, b.y, '#bff6ff', 3, 130, 'glow');
        bullets.splice(bi, 1);
        break;
      }
    }
  }

  for (let i = enemyBullets.length - 1; i >= 0; i--){
    const b = enemyBullets[i];
    b.t += dt; b.x += b.vx*dt; b.y += b.vy*dt;
    if (b.y > H+40 || b.y < -40 || b.x < -40 || b.x > W+40){ enemyBullets.splice(i,1); continue; }
    if (aabb(b, player) && player.invuln <= 0){ enemyBullets.splice(i, 1); hurtPlayer(); }
  }

  for (let i = powerups.length - 1; i >= 0; i--){
    const pu = powerups[i];
    pu.y += pu.vy*dt; pu.t += dt;
    if (pu.y > H + 40){ powerups.splice(i,1); continue; }
    if (aabb(pu, player)){
      applyPower(pu.type);
      explosion(pu.x + pu.w/2, pu.y + pu.h/2, POWER_DEFS[pu.type].color, 0.8);
      powerups.splice(i, 1);
    }
  }

  for (let i = particles.length - 1; i >= 0; i--){
    const pt = particles[i];
    pt.x += pt.vx*dt; pt.y += pt.vy*dt;
    const damp = pt.kind === 'dot' ? 0.97 : 0.94;
    pt.vx *= damp; pt.vy *= damp;
    pt.rot += pt.vr*dt;
    pt.life -= dt;
    if (pt.life <= 0) particles.splice(i, 1);
  }

  if (spawnQueue.length === 0 && enemies.length === 0 && state === STATE.PLAY){
    if (wave >= wavesPerLevel) levelComplete();
    else startWave();
  }
}

function levelComplete(){
  const bonus = 500*level + lives*250;
  score += bonus;
  if (score > best){ best = score; try { localStorage.setItem('nova_best', String(best)); } catch(e){} }
  el.luScore.textContent = score.toLocaleString();
  el.luLives.textContent = lives;
  el.luBonus.textContent = '+' + bonus.toLocaleString();
  el.levelBig.textContent = 'LEVEL ' + (level + 1);
  sfx('level');
  state = STATE.LEVELUP;
  show(el.levelup);
}

/* ---------------- Render ---------------- */
function renderWorld(){
  drawBackground();

  ctx.save();
  if (shake > 0.2) ctx.translate(rand(-shake, shake)*0.5, rand(-shake, shake)*0.5);

  for (const pt of particles){
    const a = clamp(pt.life/pt.maxLife, 0, 1) * pt.alpha;
    if (pt.kind === 'glow'){ drawSprite('glow', pt.x, pt.y, pt.size * (0.6 + a*0.8), 0, a * 0.8); continue; }
    if (pt.kind === 'ring'){
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(pt.x, pt.y); ctx.rotate(pt.rot);
      const im = SPR.ring;
      if (im && im.complete) ctx.drawImage(im, -pt.size/2, -pt.size/2, pt.size, pt.size);
      ctx.restore();
      continue;
    }
    ctx.globalAlpha = a;
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;

  for (const pu of powerups){
    const def = POWER_DEFS[pu.type];
    const bob = Math.sin(pu.t*5) * 0.10;
    drawSprite('glow', pu.x + pu.w/2, pu.y + pu.h/2, 74, 0, 0.45);
    drawSprite(def.sprite, pu.x + pu.w/2, pu.y + pu.h/2, 46 * (1 + bob), pu.t*1.2, 1);
  }

  for (const e of enemies){
    const cx = e.x + e.w/2, cy = e.y + e.h/2;
    const size = { grunt:70, zig:60, gunner:68, tank:114, boss:220 }[e.type] || 70;
    let rot = 0;
    if (e.type === 'zig') rot = Math.sin(e.t*2.2) * 0.28;
    else if (e.type === 'grunt') rot = Math.sin(e.t*1.5) * 0.12;
    else if (e.type === 'tank') rot = Math.sin(e.t*1.1) * 0.06;
    drawSprite('glow', cx, cy, size*0.85, 0, 0.28);
    drawSprite(e.type, cx, cy, size, rot, 1);
    // hit flash as a fading overlay, so a constantly-hit boss never turns solid white
    if (e.hitFlash > 0) drawSprite(e.type, cx, cy, size, rot, clamp(e.hitFlash/0.12, 0, 1) * 0.8, true);
    if (e.maxHp > 5 && e.hp < e.maxHp){
      const bw = e.w, bh = 4, bx = e.x, by = e.y - 10;
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = e.type === 'boss' ? '#ff3b6b' : '#5ce1e6';
      ctx.fillRect(bx, by, bw * clamp(e.hp/e.maxHp, 0, 1), bh);
    }
  }

  if (state === STATE.PLAY && player.alive){
    const cx = player.x + player.w/2, cy = player.y + player.h/2;
    const blink = player.invuln > 0 && Math.floor(player.invuln*12) % 2 === 0;
    drawSprite('glow', cx, cy + 6, 96, 0, 0.30);
    drawSprite('player', cx, cy, 96, 0, blink ? 0.35 : 1);
    if (player.shield > 0) drawSprite('ring', cx, cy, 92, 0, 0.30 + Math.sin(elapsed*8)*0.14);
  }

  for (const b of bullets){
    drawSprite('glow', b.x + b.w/2, b.y + b.h/2, 30, 0, 0.85);
    ctx.fillStyle = b.hue;
    ctx.fillRect(b.x, b.y, b.w, b.h);
  }
  for (const b of enemyBullets){
    drawSprite('glow', b.x + b.w/2, b.y + b.h/2, 34, 0, 0.9);
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x + b.w/2, b.y + b.h/2, b.w/2 + 1, 0, 7); ctx.fill();
  }

  ctx.restore();

  if (warnT > 0 && warnGrad){
    ctx.globalAlpha = clamp(warnT/0.5, 0, 1);
    ctx.fillStyle = warnGrad;
    ctx.fillRect(0, H - 120, W, 120);
    ctx.globalAlpha = 1;
  }
  if (flashT > 0){ ctx.fillStyle = 'rgba(255,80,110,' + (flashT*0.9) + ')'; ctx.fillRect(0,0,W,H); }
  if (qLevel < 2 && vigGrad){ ctx.fillStyle = vigGrad; ctx.fillRect(0,0,W,H); }
}

/* HUD in screen space, scaled for phone screens + safe areas */
function renderHUD(){
  const cw = canvas.width / dpr, ch = canvas.height / dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.textBaseline = 'top';
  const S = uiScale;
  const padL = safeLeft + 16*S, padR = safeRight + 16*S, padT = safeTop + 12*S;

  ctx.textAlign = 'left';
  ctx.fillStyle = '#e8f6ff';
  ctx.font = '800 ' + Math.round(30*S) + 'px "Segoe UI", sans-serif';
  ctx.fillText(score.toLocaleString(), padL, padT);
  ctx.fillStyle = '#6d8aa5';
  ctx.font = '700 ' + Math.round(12*S) + 'px "Segoe UI", sans-serif';
  ctx.fillText('SCORE', padL + 2*S, padT + 32*S);

  // lives (top-left, under score)
  const heart = SPR.player;
  const lz = 26*S;
  for (let i = 0; i < Math.max(0, lives); i++){
    if (heart && heart.complete) ctx.drawImage(heart, padL + i*lz, padT + 52*S, lz*0.92, lz*0.92);
  }

  // level / wave centred
  ctx.textAlign = 'center';
  ctx.fillStyle = '#5ce1e6';
  ctx.font = '800 ' + Math.round(19*S) + 'px "Segoe UI", sans-serif';
  ctx.fillText('LEVEL ' + level, cw/2, padT + 2*S);
  ctx.fillStyle = '#6d8aa5';
  ctx.font = '700 ' + Math.round(12*S) + 'px "Segoe UI", sans-serif';
  ctx.fillText('WAVE ' + Math.min(wave, wavesPerLevel) + '/' + wavesPerLevel, cw/2, padT + 26*S);

  // power-up chips
  let px = padL, py = padT + 82*S;
  ctx.textAlign = 'left';
  ctx.font = '800 ' + Math.round(12*S) + 'px "Segoe UI", sans-serif';
  const chips = [];
  if (player.rapid > 0)  chips.push(['RAPID ' + player.rapid.toFixed(0) + 's', '#ffd166']);
  if (player.shield > 0) chips.push(['SHIELD ' + player.shield.toFixed(0) + 's', '#5ce1e6']);
  if (player.weapon > 1) chips.push(['WEAPON ' + player.weapon, '#8b5cff']);
  for (const c of chips){
    const w = ctx.measureText(c[0]).width + 20*S;
    ctx.fillStyle = 'rgba(8,12,26,0.6)';
    ctx.fillRect(px, py, w, 24*S);
    ctx.strokeStyle = c[1]; ctx.lineWidth = 1.5;
    ctx.strokeRect(px + 0.5, py + 0.5, w - 1, 24*S - 1);
    ctx.fillStyle = c[1];
    ctx.fillText(c[0], px + 10*S, py + 6*S);
    px += w + 8*S;
  }

  if (escapeT > 0){
    ctx.save();
    ctx.globalAlpha = clamp(escapeT/0.9, 0, 1);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '800 ' + Math.round(17*S) + 'px "Segoe UI", sans-serif';
    ctx.fillStyle = '#ff3b6b';
    ctx.shadowColor = '#ff3b6b'; ctx.shadowBlur = 16;
    ctx.fillText('ESCAPED \u2014 RETURNING', cw/2, ch - safeBottom - 76*S);
    ctx.restore();
  }

  if (waveBannerT > 0){
    const a = clamp(waveBannerT/2.4, 0, 1);
    const isWarn = waveBanner.indexOf('WARNING') === 0;
    ctx.save();
    ctx.globalAlpha = Math.min(1, a*2.4) * (waveBannerT > 0.5 ? 1 : waveBannerT*2);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '800 ' + Math.round((isWarn ? 40 : 30)*S) + 'px "Segoe UI", sans-serif';
    ctx.fillStyle = isWarn ? '#ff3b6b' : '#5ce1e6';
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 24;
    ctx.fillText(waveBanner, cw/2, ch*0.42);
    ctx.restore();
  }
}

function render(){
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  renderWorld();
  if (state === STATE.PLAY || state === STATE.PAUSE || state === STATE.LEVELUP) renderHUD();
  else ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* ---------------- Resize (fills the phone screen) ---------------- */
function readSafeAreas(){
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;' +
    'padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);';
  document.body.appendChild(probe);
  const cs = getComputedStyle(probe);
  safeTop = parseFloat(cs.paddingTop) || 0;
  safeRight = parseFloat(cs.paddingRight) || 0;
  safeBottom = parseFloat(cs.paddingBottom) || 0;
  safeLeft = parseFloat(cs.paddingLeft) || 0;
  document.body.removeChild(probe);
}

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);   // cap for phone GPUs
  const cw = Math.max(1, window.innerWidth);
  const ch = Math.max(1, window.innerHeight);
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';

  const portrait = ch >= cw;
  // the constrained axis is always BASE world units
  scale = portrait ? canvas.width / BASE : canvas.height / BASE;
  if (portrait){ W = BASE; H = canvas.height / scale; }
  else { H = BASE; W = canvas.width / scale; }

  VS = H / BASE;                       // vertical speeds track screen height
  uiScale = clamp(Math.min(cw, ch) / 760, 0.62, 1.15);
  readSafeAreas();

  bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#050713');
  bgGrad.addColorStop(0.55, '#03040d');
  bgGrad.addColorStop(1, '#070512');
  vigGrad = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.32, W/2, H/2, Math.max(W,H)*0.72);
  vigGrad.addColorStop(0, 'rgba(0,0,0,0)');
  vigGrad.addColorStop(1, 'rgba(0,0,0,0.55)');
  warnGrad = ctx.createLinearGradient(0, H, 0, H - 120);
  warnGrad.addColorStop(0, 'rgba(255,59,107,0.6)');
  warnGrad.addColorStop(1, 'rgba(255,59,107,0)');

  buildDeepLayer();
  if (bg) layoutBackground();
  if (player){
    player.x = clamp(player.x, 6, W - player.w - 6);
    player.y = clamp(player.y, 6, H - player.h - 6);
  }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

/* ---------------- Fullscreen (best effort) ---------------- */
function goFullscreen(){
  const d = document.documentElement;
  try {
    if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen({ navigationUI:'hide' }).catch(()=>{});
    else if (d.webkitRequestFullscreen) d.webkitRequestFullscreen();
  } catch(e){}
}

/* ---------------- Buttons ---------------- */
el.btnStart.addEventListener('click', () => {
  audio();
  goFullscreen();
  hideAll(); newGame(); state = STATE.PLAY; lastT = performance.now();
  if (COARSE){ hintShown = false; el.touchhint.classList.add('on'); setTimeout(()=>el.touchhint.classList.remove('on'), 3200); }
});
el.btnResume.addEventListener('click', () => { hide(el.pause); state = STATE.PLAY; lastT = performance.now(); });
el.btnQuit.addEventListener('click', () => { hideAll(); newGame(); state = STATE.MENU; show(el.menu); });
el.btnNext.addEventListener('click', () => {
  hide(el.levelup);
  level++; wave = 0;
  const carried = Math.min(3, player.weapon + 1);
  resetPlayer();
  player.weapon = carried;
  state = STATE.PLAY; lastT = performance.now();
  startWave();
});
el.btnRetry.addEventListener('click', () => { hideAll(); newGame(); state = STATE.PLAY; lastT = performance.now(); });
el.btnPause.addEventListener('click', (e) => { e.preventDefault(); audio(); togglePause(); });
el.btnMute.addEventListener('click', (e) => { e.preventDefault(); audio(); toggleMute(); });

/* ---------------- Boot ---------------- */
function buildLegend(){
  const items = [['grunt','Grunt'],['zig','Zig'],['gunner','Gunner'],['tank','Tank'],['boss','Boss']];
  el.legend.innerHTML = items.map(it =>
    '<div><img src="' + SPRITE_DATA[it[0]] + '" alt="">' + it[1] + '</div>').join('');
}

let lastTop = null;
function syncTopButtons(){
  const on = state === STATE.PLAY;
  if (on !== lastTop){ el.topbtns.classList.toggle('on', on); lastTop = on; }
}

function boot(){
  buildTextures();
  buildLegend();
  resize();
  newGame();
  state = STATE.MENU;
  show(el.menu);
  lastT = performance.now();
  requestAnimationFrame(function loop(now){
    let dt = (now - lastT) / 1000;
    lastT = now;
    if (dt > 0.05) dt = 0.05;
    perfTick(dt);
    update(dt);
    render();
    syncTopButtons();
    requestAnimationFrame(loop);
  });
}

loadSprites(boot);

})();
</script>
